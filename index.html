<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adda | Staff Login</title>
    <style>
        body { font-family: sans-serif; background: #fcf9f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #d35400; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[readonly] { background-color: #eee; color: #555; cursor: not-allowed; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ecc71; }
        #error-msg { color: #e74c3c; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Staff POS Login</h2>
        <form id="login-form">
            <!-- Email is pre-filled and uneditable (readonly) -->
            <input type="email" id="email" value="staff@adda.com" readonly>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit">Login to Billing</button>
        </form>
        <div id="error-msg"></div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
