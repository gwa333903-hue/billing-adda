<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Authentication</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 35px 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; color: #e74c3c; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[readonly] { background: #eaeaec; color: #555; cursor: not-allowed; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; background: #e74c3c; margin-top: 10px; }
        button:hover { background: #c0392b; }
        button:disabled { background: #e08e86; cursor: not-allowed; }
        .back-btn { display: inline-block; margin-top: 20px; color: #3498db; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Owner Access</h2>
        
        <div class="input-group">
            <label>Admin Email</label>
            <input type="email" id="email" value="owner@adda.com" readonly>
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter owner password">
        </div>
        
        <button id="login-btn">Secure Login</button>
        <a href="billing.html" class="back-btn">← Back to POS</a>
    </div>

    <script type="module" src="ownerlogin.js"></script>
</body>
</html>
